[project]
name = "math-parser"
version = "0.1.0"
description = "Clean and structurally annotate OCR-derived mathematics Markdown"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27.0",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_parser"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
